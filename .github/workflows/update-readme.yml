name: 🔄 Dynamic README Updater

on:
  schedule:
    - cron: "0 1 * * *"   # daily at 01:00 UTC (06:30 IST)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"         # avoid recursive trigger from bot commits

jobs:
  update-readme:
    name: Fetch GitHub data & update README
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🔍 Fetch GitHub data & inject into README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_readme.py

      - name: 📝 Commit README updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "✅ README already up to date"
          else
            TIMESTAMP=$(TZ='Asia/Kolkata' date '+%d %b %Y %I:%M %p IST')
            git commit -m "🤖 chore: auto-update readme [${TIMESTAMP}]"
            git push
          fi
